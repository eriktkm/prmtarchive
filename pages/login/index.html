<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Primata Archive</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- Efeito de scanlines -->
    <div class="scanlines"></div>

    <!-- Fundo decorativo -->
    <div class="pixel-grid"></div>

    <main class="login-page">

        <!-- Logo -->
        <header class="login-header">
            <a href="../landing/index.html" class="logo">
                <span class="logo-symbol">◆</span>
                PRIMATA <span>ARCHIVE</span>
            </a>
        </header>

        <!-- Login -->
        <section class="login-container">

            <div class="login-window">

                <div class="window-header">
                    <span>PRIMATA_ARCHIVE.EXE</span>

                    <div class="window-buttons">
                        <span>_</span>
                        <span>□</span>
                        <span>×</span>
                    </div>
                </div>

                <div class="login-content">

                    <div class="terminal">
                        <span>&gt;</span> ACCESS_SYSTEM<span class="blink">_</span>
                    </div>

                    <h1>
                        BEM-VINDO<br>
                        <span>DE VOLTA.</span>
                    </h1>

                    <p class="login-description">
                        Entre na sua conta para acessar seu arquivo musical.
                    </p>

                    <form id="loginForm">

                        <div class="input-group">
                            <label for="email">
                                E-MAIL
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="seu@email.com"
                                required
                            >
                        </div>

                        <div class="input-group">
                            <div class="password-label">
                                <label for="password">
                                    SENHA
                                </label>

                                <a href="#" class="forgot">
                                    ESQUECI A SENHA
                                </a>
                            </div>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="********"
                                required
                            >
                        </div>

                        <button type="submit" class="login-button">
                            ENTRAR
                            <span>→</span>
                        </button>

                    </form>

                    <div class="divider">
                        <span>OU</span>
                    </div>

                    <p class="register-text">
                        AINDA NÃO FAZ PARTE DO ARQUIVO?
                    </p>

                    <a href="../cadastro/index.html" class="register-button">
                        CRIAR CONTA
                    </a>

                </div>

                <div class="window-footer">
                    <span>STATUS: ONLINE</span>
                    <span>v1.0.0</span>
                </div>

            </div>

            <!-- Elemento decorativo -->
            <div class="login-decoration">
                <span>01</span>
                <span>ARCHIVE</span>
                <span>///</span>
            </div>

        </section>

        <footer class="login-footer">
            <span>© 2026 PRIMATA ARCHIVE</span>
            <span>EST. IN THE DIGITAL UNDERGROUND</span>
        </footer>

    </main>

    <script src="./main.js"></script>

</body>
</html>
