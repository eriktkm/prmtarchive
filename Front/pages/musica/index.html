<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primata Archive — Música</title>
    <link rel="stylesheet" href="../shared.css">
    <link rel="stylesheet" href="../site-overrides.css">
</head>
<body>
<div class="pixel-grid"></div>
<div class="scanlines"></div>

<header class="header">
    <a href="../../index.html" class="logo">PRIMATA<br>ARCHIVE</a>
    <nav class="nav">
        <a href="../landing/index.html">HOME</a>
        <a href="../artistas/index.html">ARTISTAS</a>
        <a href="../musicas/index.html" class="active">MÚSICAS</a>
        <a href="../albuns/index.html">ÁLBUNS</a>
        <a href="../playlist/index.html">PLAYLIST</a>
        <a href="../biblioteca/index.html">BIBLIOTECA</a>
        <a href="../comunidade/index.html">COMUNIDADE</a>
        <a href="../resultados-pesquisa/index.html" class="nav-search" aria-label="Pesquisar" title="Pesquisar"><span class="nav-search-icon" aria-hidden="true"></span></a>
    </nav>
    <a href="../login/index.html" class="header-button">ENTRAR</a>
</header>

<main class="home music-detail-page">
    <section class="music-detail-hero">
        <div class="music-detail-cover" id="music-cover">♪</div>
        <div class="music-detail-info">
            <span class="mini-title">TRACK // INFORMATION</span>
            <h1 id="music-title">CARREGANDO...</h1>
            <a id="music-artist" class="music-artist-link" href="#">ARTISTA</a>
            <p id="music-album" class="music-album">ÁLBUM —</p>
            <div class="music-tags">
                <span id="music-genre">GÊNERO</span>
                <span id="music-duration">00:00</span>
            </div>
            <div class="actions">
                <button id="play-button" class="pixel-button">▶ OUVIR</button>
                <button id="like-button" class="pixel-button alt">♡ CURTIR</button>
                <a href="../musicas/index.html" class="pixel-button alt">VOLTAR</a>
            </div>
        </div>
    </section>

    <section class="section">
        <div class="section-header"><div><span class="section-code">TRACK_001</span><h2>INFORMAÇÕES</h2></div></div>
        <div class="music-info-grid">
            <div class="pixel-card"><span class="code-label">LANÇAMENTO</span><strong id="music-release">—</strong></div>
            <div class="pixel-card"><span class="code-label">DURAÇÃO</span><strong id="music-duration-box">—</strong></div>
            <div class="pixel-card"><span class="code-label">GÊNERO</span><strong id="music-genre-box">—</strong></div>
            <div class="pixel-card"><span class="code-label">ID</span><strong id="music-id">—</strong></div>
        </div>
    </section>

    <section class="section">
        <div class="section-header"><div><span class="section-code">ABOUT_001</span><h2>SOBRE A MÚSICA</h2></div></div>
        <div class="panel"><p id="music-description">Carregando informações da faixa...</p></div>
    </section>
</main>
<script src="../api.js"></script>
<script src="../player.js"></script>
<script src="musica.js"></script>
<script src="../dados.js"></script>
<script src="../menu.js"></script>
</body>
</html>
